# ============================================
# BlogVerse API - Application Configuration
# ============================================
# Environment-specific secrets go in:
#   application-dev.yaml  (local development - GITIGNORED)
#   application-prod.yaml (production - uses real env vars)
# ============================================

spring:
  application:
    name: blogverse-api

  # Default profile for local development
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --- Database (defaults, overridden by profile) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blogverse_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10           # Max DB connections in the pool
      minimum-idle: 5                 # Keep 5 idle connections ready
      idle-timeout: 300000            # Close idle connections after 5 min
      connection-timeout: 20000       # Fail fast if no connection in 20s
      pool-name: BlogVerseHikariPool

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate              # Flyway manages schema, NOT Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false                # Prevents lazy-loading bugs in controllers

  # --- Flyway (Database Migrations) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1              # All routes prefixed with /api/v1

# --- JWT (defaults, overridden by profile) ---
jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# --- Logging ---
logging:
  level:
    com.blogverse: DEBUG
    org.springframework.security: DEBUG
    com.zaxxer.hikari: INFO

# --- Actuator (Monitoring) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
